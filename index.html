<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Космический пылесос</title><link rel="stylesheet" href="game.css?v=20260907-1"></head>
<body><div id="game"></div><script src="engine.js?v=20260907-1"></script><script>
(async function(){const p=new URLSearchParams(location.search),preview=p.get('preview'),game=(p.get('game')||'parts-of-speech-demo').replace(/[^a-zA-Z0-9_-]/g,'');try{if(preview){const raw=sessionStorage.getItem('kp-preview');if(!raw)throw new Error('Данные предпросмотра не найдены');window.GAME_CONFIG=JSON.parse(raw)}else await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='games/'+game+'.js?v=20260907-1';s.onload=ok;s.onerror=()=>bad(new Error('Не найден файл игры: '+game+'.js'));document.body.appendChild(s)});if(!window.GAME_CONFIG)throw new Error('Файл не содержит GAME_CONFIG');document.title=window.GAME_CONFIG.title||'Космический пылесос';Kosmopylesos.start(window.GAME_CONFIG,{mount:'#game'})}catch(e){document.getElementById('game').innerHTML='<main class="kp-load-error"><h1>Не удалось открыть игру</h1><p>'+e.message+'</p></main>'}})();
</script></body></html>
